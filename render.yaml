# Neon + Render free-tier blueprint for Every Mile Counts.
# Dashboard: https://dashboard.render.com  → New → Blueprint
# Create a Neon project first (https://neon.tech) and paste DATABASE_URL below.

services:
  - type: web
    name: emc-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@everymilecounts.app
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: emc-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: emc-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
